# CallPages Merchant for iOS — XcodeGen project spec.
# Generate with:  xcodegen generate   (CI does this on macos-15)
# The app is built UNSIGNED (CODE_SIGNING_ALLOWED=NO): distribution is via
# AltStore / TrollStore / sideloading until an Apple Developer Program
# membership exists. See README.md.
name: CallPages
options:
  bundleIdPrefix: com.callpages
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  CallPages:
    type: application
    platform: iOS
    sources:
      - path: Sources/CallPages
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: CallPages
        CFBundleName: CallPages
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: me.callpages.merchant
            CFBundleURLSchemes:
              - callpages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callpages.merchant
        # Parity release train with Android: iOS 1.4.3 == Android v1.4.3
        # feature set (see IOS-PARITY.md).
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  CallPagesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CallPagesTests
    dependencies:
      - target: CallPages

  CallPagesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CallPagesUITests
    dependencies:
      - target: CallPages

schemes:
  CallPages:
    build:
      targets:
        CallPages: all
        CallPagesTests: [test]
        CallPagesUITests: [test]
    test:
      targets:
        - CallPagesTests
        - CallPagesUITests
      gatherCoverageData: false
