name: CallPages
options:
  bundleIdPrefix: com.callpages
  deploymentTarget:
    iOS: "17.0"

targets:
  CallPages:
    type: application
    platform: iOS
    sources:
      - path: Sources/CallPages
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: CallPages
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callpages.merchant
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
